# ---- web1.example.net -> 10.0.24.24:443 ----
apiVersion: v1
kind: Service
metadata:
  name: web1-service
  namespace: proxy
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: web1-backend-address
  namespace: proxy
  labels:
    kubernetes.io/service-name: web1-service
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses: ["192.168.42.31"]
    conditions: { ready: true }
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: web1-egress-policy
  namespace: proxy
spec:
  egressMTLS:
    tlsSecret: proxy-client-tls   # client cert we present
    trustedCertSecret: internal-ca-secret       # CA we trust for the backend
    verifyServer: true
    verifyDepth: 1
    serverName: true                     # send SNI
    sslName: web1.example.net            # name checked against backend cert SAN
    protocols: "TLSv1.2 TLSv1.3"
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: web1
  namespace: proxy
spec:
  ingressClassName: nginx
  host: web1.example.net
  tls:
    secret: wildcard-frontend-tls
    redirect:
      enable: true
  policies:
    - name: web1-egress-policy
  upstreams:
    - name: web1
      service: web1-service
      port: 443
      tls:
        enable: true                     # required for mTLS to actually happen
  routes:
    - path: /
      action:
        pass: web1
