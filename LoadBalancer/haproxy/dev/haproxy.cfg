global
	maxconn 4096
	log /dev/log local0

defaults
	timeout connect 5s
	timeout client 1m
	timeout server 1m

frontend http_in
	bind *:80
	mode http
	http-request redirect scheme https code 301

frontend https_in
	bind *:443
	mode tcp
	option tcplog
	log global
	default_backend https_servers

backend https_servers
	mode tcp
	balance leastconn
	option tcp-check
	server worker1 192.168.42.21:30443 check
	server worker2 192.168.42.22:30443 check
